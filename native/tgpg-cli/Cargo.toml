[package]
name = "tgpg"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "tgpg"
path = "src/main.rs"

[dependencies]
tgpg-core = { path = "../tgpg-core" }
tgpg-bridge = { path = "../tgpg-bridge" }
tgpg-telegram = { path = "../tgpg-telegram" }
tokio = { version = "1", features = ["full"] }
tokio-postgres = "0.7"
anyhow = "1"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
