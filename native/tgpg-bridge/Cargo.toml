[package]
name = "tgpg-bridge"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
tgpg-core = { path = "../tgpg-core" }
pgwire = "0.42"
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
futures = "0.3"
anyhow = "1"
bytes = "1"
tokio-postgres = "0.7"
uuid = { version = "1", features = ["v4"] }
tracing = "0.1"

[dev-dependencies]
tokio-postgres = "0.7"
